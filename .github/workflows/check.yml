name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            service/package-lock.json
            app/package-lock.json
      - run: npm ci
        working-directory: service
      - run: npm ci
        working-directory: app
      - run: npm run check
