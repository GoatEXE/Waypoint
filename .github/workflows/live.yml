name: live
on:
  workflow_dispatch:
  pull_request:
    paths:
      - service/src/hermes.js
      - service/src/hermesHost.js
      - service/src/waypoint_github.py
      - service/scripts/live-check.mjs
      - .github/workflows/live.yml
jobs:
  live:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Hermes
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --non-interactive
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Hermes
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ([scriptblock]::Create((irm https://hermes-agent.nousresearch.com/install.ps1))) -NonInteractive
          "$env:LOCALAPPDATA\hermes\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - run: hermes --version
      - run: npm run live-check
        working-directory: service
